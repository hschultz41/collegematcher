<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Matcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #2b6cb0;
    }

    header p {
      color: #718096;
      margin-top: 0.4rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.75rem;
      max-width: 520px;
      margin: 0 auto 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
      background: white;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2b6cb0;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #2b6cb0;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #2c5282; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }

    .academic-profile {
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.25rem;
    }

    .academic-profile summary {
      font-weight: 600;
      font-size: 0.9rem;
      color: #2b6cb0;
      cursor: pointer;
    }

    .academic-profile-note {
      font-size: 0.78rem;
      color: #a0aec0;
      margin: 0.5rem 0 1rem;
    }

    .academic-profile .form-group:last-child { margin-bottom: 0; }

    .form-row {
      display: flex;
      gap: 1rem;
    }

    .form-row .form-group { flex: 1; }

    .checkbox-group { margin-bottom: 1rem; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
      color: #4a5568;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }

    #profile-msg {
      color: #2f855a;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }

    #profile-msg button {
      width: auto;
      display: inline;
      background: none;
      color: #2b6cb0;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0;
      text-decoration: underline;
      cursor: pointer;
    }

    #profile-msg button:hover { background: none; color: #2c5282; }

    #error-msg {
      color: #c53030;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }

    #results-section { max-width: 760px; margin: 0 auto; }

    #results-header {
      font-size: 1.1rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 1rem;
    }

    .college-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, transform 0.15s;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .college-card:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      transform: translateY(-1px);
    }

    .college-info h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #2d3748;
    }

    .college-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .badge-location { background: #ebf8ff; color: #2b6cb0; }
    .badge-type { background: #f0fff4; color: #276749; }

    .college-gpa {
      text-align: right;
      flex-shrink: 0;
    }

    .gpa-label {
      font-size: 0.7rem;
      color: #a0aec0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .gpa-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2b6cb0;
    }

    .majors-list {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #718096;
    }

    #no-results {
      text-align: center;
      color: #718096;
      padding: 2rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>College Matcher</h1>
    <p>Find colleges that fit your profile</p>
  </header>

  <div class="card">
    <form id="match-form">
      <div class="form-group">
        <label for="gpa">GPA (0.0 – 4.0)</label>
        <input type="number" id="gpa" min="0" max="4" step="0.01" placeholder="e.g. 3.7" required />
      </div>
      <div class="form-group">
        <label for="major">Preferred Major</label>
        <select id="major">
          <option value="">Any major</option>
        </select>
      </div>
      <div class="form-group">
        <label for="location">Location Preference</label>
        <select id="location">
          <option value="Any">Any location</option>
        </select>
      </div>
      <details class="academic-profile">
        <summary>Academic Profile (optional)</summary>
        <p class="academic-profile-note">
          These reflect Common Data Set Section C7 factors — saved with your profile for your own reference.
        </p>
        <div class="form-row">
          <div class="form-group">
            <label for="test-type">Standardized Test</label>
            <select id="test-type">
              <option value="">None taken</option>
              <option value="SAT">SAT</option>
              <option value="ACT">ACT</option>
            </select>
          </div>
          <div class="form-group">
            <label for="test-score">Score</label>
            <input type="number" id="test-score" min="1" max="1600" placeholder="e.g. 1450" />
          </div>
        </div>
        <div class="form-group">
          <label for="class-rank">Class Rank</label>
          <select id="class-rank">
            <option value="">Prefer not to say</option>
            <option value="Top 10%">Top 10%</option>
            <option value="Top 25%">Top 25%</option>
            <option value="Top 50%">Top 50%</option>
            <option value="Bottom 50%">Bottom 50%</option>
            <option value="Not ranked">Not ranked</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="extracurriculars">Extracurricular Activities</label>
            <input type="number" id="extracurriculars" min="0" max="50" placeholder="e.g. 4" />
          </div>
          <div class="form-group">
            <label for="rigor-courses">AP / IB / Honors Courses</label>
            <input type="number" id="rigor-courses" min="0" max="50" placeholder="e.g. 6" />
          </div>
        </div>
      </details>
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="save-profile" />
          Remember my profile on this device
        </label>
      </div>
      <button type="submit" id="submit-btn">Find Matches</button>
      <p id="profile-msg"></p>
      <p id="error-msg"></p>
    </form>
  </div>

  <section id="results-section" style="display:none">
    <p id="results-header"></p>
    <div id="results-list"></div>
    <p id="no-results">No colleges matched your criteria. Try adjusting your filters.</p>
  </section>

  <script>
    const PROFILE_KEY = "collegeMatcherProfile";

    function loadProfile() {
      const saved = localStorage.getItem(PROFILE_KEY);
      if (!saved) return;

      let profile;
      try {
        profile = JSON.parse(saved);
      } catch {
        localStorage.removeItem(PROFILE_KEY);
        return;
      }

      document.getElementById("gpa").value = profile.gpa ?? "";
      document.getElementById("major").value = profile.major ?? "";
      document.getElementById("location").value = profile.location ?? "Any";
      document.getElementById("test-type").value = profile.testType ?? "";
      document.getElementById("test-score").value = profile.testScore ?? "";
      document.getElementById("class-rank").value = profile.classRank ?? "";
      document.getElementById("extracurriculars").value = profile.extracurriculars ?? "";
      document.getElementById("rigor-courses").value = profile.rigorCourses ?? "";
      document.getElementById("save-profile").checked = true;
      showProfileMessage();
    }

    function showProfileMessage() {
      const msg = document.getElementById("profile-msg");
      msg.innerHTML = "";
      msg.append("Loaded your saved profile. ");
      const clearBtn = document.createElement("button");
      clearBtn.type = "button";
      clearBtn.textContent = "Forget it";
      clearBtn.addEventListener("click", () => {
        localStorage.removeItem(PROFILE_KEY);
        document.getElementById("save-profile").checked = false;
        msg.style.display = "none";
      });
      msg.append(clearBtn);
      msg.style.display = "block";
    }

    function saveProfile(profile) {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    }

    async function loadOptions() {
      const res = await fetch("/api/options");
      const data = await res.json();

      const majorSel = document.getElementById("major");
      data.majors.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        majorSel.appendChild(opt);
      });

      const locSel = document.getElementById("location");
      data.locations.forEach(l => {
        if (l === "Any") return;
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = l;
        locSel.appendChild(opt);
      });
    }

    document.getElementById("match-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("submit-btn");
      const errMsg = document.getElementById("error-msg");
      errMsg.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Searching…";

      const gpa = document.getElementById("gpa").value;
      const major = document.getElementById("major").value;
      const location = document.getElementById("location").value;
      const testType = document.getElementById("test-type").value;
      const testScore = document.getElementById("test-score").value;
      const classRank = document.getElementById("class-rank").value;
      const extracurriculars = document.getElementById("extracurriculars").value;
      const rigorCourses = document.getElementById("rigor-courses").value;

      if (document.getElementById("save-profile").checked) {
        saveProfile({ gpa, major, location, testType, testScore, classRank, extracurriculars, rigorCourses });
        showProfileMessage();
      } else {
        localStorage.removeItem(PROFILE_KEY);
        document.getElementById("profile-msg").style.display = "none";
      }

      try {
        const res = await fetch("/api/match", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gpa: parseFloat(gpa), major, location }),
        });

        let data;
        try {
          data = await res.json();
        } catch {
          errMsg.textContent = `Server error (${res.status}). Check the terminal for details.`;
          errMsg.style.display = "block";
          return;
        }

        if (!res.ok) {
          errMsg.textContent = data.error || "Something went wrong.";
          errMsg.style.display = "block";
          return;
        }

        renderResults(data.matches, data.total);
      } catch {
        errMsg.textContent = "Could not reach the server. Is python3 app.py running?";
        errMsg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Find Matches";
      }
    });

    function renderResults(matches, total) {
      const section = document.getElementById("results-section");
      const header = document.getElementById("results-header");
      const list = document.getElementById("results-list");
      const noResults = document.getElementById("no-results");

      section.style.display = "block";
      list.innerHTML = "";

      if (total === 0) {
        header.textContent = "";
        noResults.style.display = "block";
        return;
      }

      noResults.style.display = "none";
      header.textContent = `${total} college${total !== 1 ? "s" : ""} matched your profile`;

      matches.forEach(college => {
        const card = document.createElement("a");
        card.className = "college-card";
        card.href = `/college/${college.slug}`;
        card.innerHTML = `
          <div class="college-info">
            <h3>${college.name}</h3>
            <div class="college-meta">
              <span class="badge badge-location">${college.location}</span>
              <span class="badge badge-type">${college.type}</span>
            </div>
            <p class="majors-list">${college.majors}</p>
          </div>
          <div class="college-gpa">
            <div class="gpa-label">Min GPA</div>
            <div class="gpa-value">${college.min_gpa.toFixed(1)}</div>
          </div>
        `;
        list.appendChild(card);
      });

      section.scrollIntoView({ behavior: "smooth" });
    }

    loadOptions().then(loadProfile);
  </script>
</body>
</html>
