<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Simulator – College Matcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .back-link {
      display: inline-block;
      max-width: 760px;
      margin: 0 auto 1rem;
      color: #2b6cb0;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    .wrapper {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #2b6cb0;
    }

    header p {
      color: #718096;
      margin-top: 0.4rem;
    }

    #status-msg {
      text-align: center;
      color: #718096;
      padding: 2rem;
    }

    #status-msg a { color: #2b6cb0; font-weight: 600; }

    .disclaimer {
      text-align: center;
      font-size: 0.78rem;
      color: #a0aec0;
      margin-bottom: 1.25rem;
    }

    .simulate-btn {
      display: block;
      margin: 0 auto 1.5rem;
      padding: 0.65rem 1.5rem;
      background: #2b6cb0;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(43, 108, 176, 0.3);
      transition: background 0.2s;
    }

    .simulate-btn:hover { background: #2c5282; }
    .simulate-btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .summary-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .summary-accepted { color: #276749; }
    .summary-waitlisted { color: #6b46c1; }
    .summary-rejected { color: #c53030; }

    .category-section { margin-bottom: 2rem; }

    .category-section h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 1rem;
    }

    .empty-msg {
      color: #a0aec0;
      font-size: 0.875rem;
      padding: 0.5rem 0;
    }

    .college-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, transform 0.15s;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .college-card:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      transform: translateY(-1px);
    }

    .college-info h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #2d3748;
    }

    .college-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .badge-location { background: #ebf8ff; color: #2b6cb0; }
    .badge-type { background: #f0fff4; color: #276749; }

    .category-badge-safety { background: #c6f6d5; color: #276749; }
    .category-badge-target { background: #ebf8ff; color: #2b6cb0; }
    .category-badge-reach { background: #feebc8; color: #9c4221; }
    .category-badge-hard-reach { background: #fed7d7; color: #c53030; }

    .college-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .decision-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .decision-badge-accepted { background: #c6f6d5; color: #276749; }
    .decision-badge-waitlisted { background: #faf5ff; color: #6b46c1; }
    .decision-badge-rejected { background: #fed7d7; color: #c53030; }

    .match-score {
      font-size: 0.78rem;
      color: #a0aec0;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <a href="/recommendations" class="back-link">&larr; Back to application list</a>
    <header>
      <h1>Decision Simulator</h1>
      <p>A randomized preview of how decisions might play out for your list</p>
    </header>

    <p id="status-msg">Loading your application list…</p>

    <div id="simulation-content" style="display:none">
      <p class="disclaimer">These results are randomly generated for demonstration purposes and don't reflect real admissions odds.</p>
      <button id="simulate-btn" class="simulate-btn" type="button">Simulate Again</button>
      <div class="summary-bar" id="summary-bar"></div>

      <section class="category-section">
        <h2>Reach Schools</h2>
        <div id="reach-list"></div>
      </section>
      <section class="category-section">
        <h2>Target Schools</h2>
        <div id="target-list"></div>
      </section>
      <section class="category-section">
        <h2>Safety Schools</h2>
        <div id="safety-list"></div>
      </section>
    </div>
  </div>

  <script>
    const PROFILE_KEY = "collegeMatcherProfile";

    const CATEGORY_BADGE_CLASSES = {
      "Hard Reach": "category-badge-hard-reach",
      Reach: "category-badge-reach",
      Target: "category-badge-target",
      Safety: "category-badge-safety",
    };

    const DECISION_BADGE_CLASSES = {
      Accepted: "decision-badge-accepted",
      Waitlisted: "decision-badge-waitlisted",
      Rejected: "decision-badge-rejected",
    };

    function loadStudentProfile() {
      const saved = localStorage.getItem(PROFILE_KEY);
      if (!saved) return null;
      try {
        return JSON.parse(saved);
      } catch {
        return null;
      }
    }

    function renderCollegeCard(college) {
      const card = document.createElement("a");
      card.className = "college-card";
      card.href = `/college/${college.slug}`;

      const categoryClass = CATEGORY_BADGE_CLASSES[college.application_category] || "";
      const decisionClass = DECISION_BADGE_CLASSES[college.decision] || "";

      card.innerHTML = `
        <div class="college-info">
          <h3>${college.name}</h3>
          <div class="college-meta">
            <span class="badge badge-location">${college.location}</span>
            <span class="badge badge-type">${college.type}</span>
            <span class="badge ${categoryClass}">${college.application_category}</span>
          </div>
        </div>
        <div class="college-stats">
          <div class="decision-badge ${decisionClass}">${college.decision}</div>
          <div class="match-score">${college.match_score}% Match</div>
        </div>
      `;
      return card;
    }

    function renderList(containerId, colleges) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if (colleges.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-msg";
        empty.textContent = "No schools available in this category.";
        container.appendChild(empty);
        return;
      }

      colleges.forEach(college => container.appendChild(renderCollegeCard(college)));
    }

    function renderSummary(allColleges) {
      const counts = { Accepted: 0, Waitlisted: 0, Rejected: 0 };
      allColleges.forEach(college => {
        if (college.decision in counts) counts[college.decision]++;
      });

      document.getElementById("summary-bar").innerHTML = `
        <span class="summary-accepted">${counts.Accepted} Accepted</span>
        <span class="summary-waitlisted">${counts.Waitlisted} Waitlisted</span>
        <span class="summary-rejected">${counts.Rejected} Rejected</span>
      `;
    }

    async function runSimulation() {
      const statusMsg = document.getElementById("status-msg");
      const btn = document.getElementById("simulate-btn");
      const profile = loadStudentProfile();

      if (!profile) {
        statusMsg.innerHTML = 'Save your academic profile on the <a href="/">search page</a> to simulate decisions.';
        return;
      }

      btn.disabled = true;
      btn.textContent = "Simulating…";

      try {
        const res = await fetch("/api/simulate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(profile),
        });

        let data;
        try {
          data = await res.json();
        } catch {
          statusMsg.textContent = `Server error (${res.status}). Check the terminal for details.`;
          return;
        }

        if (!res.ok) {
          statusMsg.innerHTML = `${data.error || "Something went wrong."} Fill out your <a href="/">Academic Profile</a> and save it first.`;
          return;
        }

        renderList("reach-list", data.reaches);
        renderList("target-list", data.targets);
        renderList("safety-list", data.safeties);
        renderSummary([...data.reaches, ...data.targets, ...data.safeties]);

        statusMsg.style.display = "none";
        document.getElementById("simulation-content").style.display = "block";
      } catch {
        statusMsg.textContent = "Could not reach the server. Is python3 app.py running?";
      } finally {
        btn.disabled = false;
        btn.textContent = "Simulate Again";
      }
    }

    document.getElementById("simulate-btn").addEventListener("click", runSimulation);
    runSimulation();
  </script>
</body>
</html>
